name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[serial,dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check integrations/dsh/index.mjs
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pip install jsonschema && python tests/check_server_json.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install cores and libraries
        run: |
          arduino-cli core install arduino:avr esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install Servo ESP32Servo@3.2.1
      - name: Compile every board / transport combination
        run: |
          set -e
          now="--build-property compiler.cpp.extra_flags=-DTRANSPORT_ESPNOW=1"
          arduino-cli compile -b arduino:avr:uno firmware/line_protocol
          arduino-cli compile -b esp32:esp32:esp32 firmware/line_protocol
          arduino-cli compile -b esp32:esp32:nologo_esp32c3_super_mini firmware/line_protocol
          arduino-cli compile -b esp32:esp32:esp32 $now firmware/line_protocol
          arduino-cli compile -b esp32:esp32:nologo_esp32c3_super_mini $now firmware/line_protocol
          arduino-cli compile -b esp32:esp32:esp32 firmware/espnow_dongle
          arduino-cli compile -b esp32:esp32:nologo_esp32c3_super_mini firmware/espnow_dongle
          # encrypted ESP-NOW (example keys, CI only)
          arduino-cli compile -b esp32:esp32:esp32 --build-property 'compiler.cpp.extra_flags=-DTRANSPORT_ESPNOW=1 -DNOW_PMK="pmk_ci_0123456789" -DNOW_LMK="lmk_ci_0123456789"' firmware/line_protocol
          arduino-cli compile -b esp32:esp32:esp32 --build-property 'compiler.cpp.extra_flags=-DNOW_PMK="pmk_ci_0123456789" -DNOW_LMK="lmk_ci_0123456789"' firmware/espnow_dongle