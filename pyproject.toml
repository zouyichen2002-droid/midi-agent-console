[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-agent-console"
version = "0.1.0"
description = "A MIDI keyboard as a physical console for AI agents (MCP), driving external hardware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mido = ["mido>=1.3", "python-rtmidi>=1.5"]  # non-Windows MIDI backend
dev = ["pytest>=8"]

[project.scripts]
midi-agent-console = "midi_agent_console.__main__:main"

[tool.setuptools]
packages = ["midi_agent_console"]
