[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-agent-console"
version = "0.4.0"
description = "A MIDI keyboard as a physical console for AI agents (MCP), driving external hardware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
audio = ["sounddevice>=0.5"]  # low-latency feedback tones; without it: stdlib PlaySound
mido = ["mido>=1.3"]  # non-Windows MIDI backend; pair with rtmidi2 or python-rtmidi
dev = ["pytest>=8", "anyio>=4", "httpx>=0.27"]

[project.scripts]
midi-agent-console = "midi_agent_console.__main__:main"

[tool.setuptools]
packages = ["midi_agent_console"]
